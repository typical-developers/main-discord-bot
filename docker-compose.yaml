services:
  migrations:
    build:
      context: .
      dockerfile: ./cmd/migrations/Dockerfile
    restart: no
    env_file: ./.env
    environment:
      GOOSE_DBSTRING: >-
        host=${DATABASE_HOST}
        port=${DATABASE_PORT}
        user=${DATABASE_USERNAME}
        password=${DATABASE_PASSWORD}
        dbname=${DATABASE_DB}
        sslmode=${DATABASE_SSL_MODE}

  workers:
    build:
      context: .
      dockerfile: ./cmd/workers/Dockerfile
    depends_on:
      migrations:
        condition: service_completed_successfully
    env_file: ./.env
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: ./cmd/bot/Dockerfile
    depends_on:
      migrations:
        condition: service_completed_successfully
    env_file: ./.env
    restart: unless-stopped
